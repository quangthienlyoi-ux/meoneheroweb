<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MeoNeHero - Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body {
            background: #02232d;
            background: linear-gradient(180deg, #022834 0%, #011822 40%, #000000 100%);
            color: #fff;
            font-family: 'VT323', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 15px 120px 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* --- HIỆU ỨNG QUẦNG SÁNG XANH DƯƠNG & TRẮNG Ở ĐÁY MÀN HÌNH --- */
        body::after {
            content: '';
            position: fixed;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 120%;
            height: 180px;
            background: radial-gradient(ellipse at bottom, rgba(56, 189, 248, 0.35) 0%, rgba(255, 255, 255, 0.15) 35%, rgba(0,0,0,0) 70%);
            pointer-events: none;
            z-index: 1;
            animation: bottomGlow 4s ease-in-out infinite alternate;
        }

        @keyframes bottomGlow {
            0% { opacity: 0.7; transform: translateX(-50%) scale(0.98); }
            100% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }

        /* --- HEADER PROFILE --- */
        .profile {
            width: 100%;
            max-width: 380px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 5px;
            margin-bottom: 20px;
            z-index: 2;
        }

        .avatar-frame {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #38bdf8;
            padding: 2px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #000;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
        }

        .username {
            font-size: 28px;
            font-weight: bold;
            color: #38bdf8;
            line-height: 1;
            letter-spacing: 0.5px;
        }

        .subtext {
            font-size: 18px;
            color: #7dd3fc;
            margin-top: 2px;
        }

        .quote-label {
            font-size: 15px;
            color: #94a3b8;
            margin-top: 3px;
        }

        .quote {
            font-size: 16px;
            color: #cbd5e1;
        }

        /* --- DANH SÁCH FILE --- */
        .file-list {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 2;
        }

        .file-card {
            background: #000000;
            border: 2px solid #ffffff;
            border-radius: 35px;
            padding: 6px 15px 6px 6px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: inherit;
            position: relative;
            transition: transform 0.1s ease;
        }

        .file-card:active {
            transform: scale(0.97);
        }

        .banner {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            background: #ffffff;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            flex-shrink: 0;
            overflow: hidden;
            object-fit: cover;
        }

        .file-info {
            margin-left: 12px;
            flex-grow: 1;
        }

        .file-title {
            font-size: 22px;
            color: #ffffff;
            line-height: 1;
        }

        .file-desc {
            font-size: 15px;
            color: #a1a1aa;
            margin-top: 2px;
        }

        .btn-card-del {
            background: #ef4444;
            color: white;
            border: 1px solid #fff;
            border-radius: 15px;
            padding: 2px 8px;
            font-family: 'VT323', monospace;
            font-size: 16px;
            cursor: pointer;
            margin-left: 6px;
        }

        /* --- THANH NHẬP AI VỪA KHÍT & CHỮ MỜ MỜ (CHUẨN VIDEO/MOCKUP) --- */
        .ai-chat-bar {
            position: fixed;
            bottom: 20px;
            width: calc(100% - 30px);
            max-width: 380px;
            height: 48px;
            background: linear-gradient(90deg, rgba(42, 65, 58, 0.85) 0%, rgba(62, 79, 71, 0.85) 50%, rgba(79, 89, 91, 0.85) 100%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 25px;
            padding: 4px 6px 4px 14px;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            z-index: 90;
        }

        .ai-icon-plus {
            font-size: 20px;
            color: rgba(167, 243, 208, 0.8);
            margin-right: 8px;
            font-weight: bold;
        }

        .ai-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-family: 'VT323', monospace;
            font-size: 18px; /* Chữ vừa vặn không bị to */
            letter-spacing: 0.5px;
        }

        /* Chữ mờ mờ mượt mà */
        .ai-input::placeholder {
            color: rgba(255, 255, 255, 0.45);
            font-size: 16px;
        }

        .ai-btn {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
            border: 1.5px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }

        .ai-btn:active {
            transform: scale(0.9);
        }

        .ai-btn-arrow {
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 10px solid #ffffff;
            margin-left: 2px;
        }

        /* --- MODALS --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #09131a;
            border: 2px solid #ffffff;
            border-radius: 20px;
            padding: 18px;
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-title {
            font-size: 24px;
            color: #38bdf8;
            text-align: center;
        }

        .input-field {
            background: #000;
            border: 1px solid #ffffff;
            border-radius: 8px;
            padding: 8px 10px;
            color: white;
            outline: none;
            font-family: 'VT323', monospace;
            font-size: 18px;
        }

        .btn-submit {
            background: #0284c7;
            color: white;
            border: 1px solid #fff;
            border-radius: 8px;
            padding: 6px;
            font-family: 'VT323', monospace;
            font-size: 20px;
            cursor: pointer;
        }

        .btn-cancel {
            color: #94a3b8;
            text-align: center;
            font-size: 16px;
            cursor: pointer;
        }

        .ai-response-box {
            max-height: 200px;
            overflow-y: auto;
            font-size: 18px;
            color: #e2e8f0;
            background: #000;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 8px;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <div class="profile">
        <div class="avatar-frame" id="avatarBtn">
            <img class="avatar" src="https://via.placeholder.com/100" alt="Avatar">
        </div>
        <div class="profile-info">
            <div class="username">MeoNeHero</div>
            <div class="subtext">~1500 Followers</div>
            <div class="quote-label">câu nói để đời:</div>
            <div class="quote">BadTimeSans gay v1</div>
        </div>
    </div>

    <div class="file-list" id="fileContainer"></div>

    <div class="ai-chat-bar">
        <span class="ai-icon-plus">+</span>
        <input type="text" id="aiInput" class="ai-input" placeholder="bạn có câu hỏi? Hỏi ngay AI">
        <div class="ai-btn" onclick="sendAiQuestion()">
            <div class="ai-btn-arrow"></div>
        </div>
    </div>

    <div class="modal" id="aiModal">
        <div class="modal-content">
            <div class="modal-title">Trả lời từ AI</div>
            <div class="ai-response-box" id="aiResponse">Đang suy nghĩ...</div>
            <div class="btn-cancel" onclick="closeModals()">Đóng</div>
        </div>
    </div>

    <div class="modal" id="pwModal">
        <div class="modal-content">
            <div class="modal-title">Xác thực Admin</div>
            <input type="password" id="pwInput" class="input-field" placeholder="Nhập mật khẩu...">
            <button class="btn-submit" onclick="checkPassword()">Xác nhận</button>
            <div class="btn-cancel" onclick="closeModals()">Hủy</div>
        </div>
    </div>

    <div class="modal" id="adminModal">
        <div class="modal-content">
            <div class="modal-title">Thêm File Mới</div>
            <input type="text" id="fileTitle" class="input-field" placeholder="Tên file">
            <input type="text" id="fileDesc" class="input-field" placeholder="Mô tả...">
            <input type="text" id="fileBanner" class="input-field" placeholder="Link ảnh Banner">
            <input type="text" id="fileLink" class="input-field" placeholder="Link Mediafire / Lưu trữ">
            <button class="btn-submit" onclick="addNewFile()">Đăng File</button>
            <div class="btn-cancel" onclick="closeModals()">Đóng</div>
        </div>
    </div>

    <script>
        // CẤU HÌNH SUPABASE & KEY AI
        const SUPABASE_URL = "https://uipjgdkasbcdhxlmzclc.supabase.co/rest/v1/"; 
        const SUPABASE_KEY = "sb_publishable_XApMlu8Nm_kJF8ceuPvsQg_E-g19QwX";             
        const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY";     

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const AUTH_PASS = "meoneheroundertale";

        let filesData = [];
        let isDeleteMode = false;
        let pendingAction = null;

        // Tải danh sách file
        async function loadFiles() {
            const { data, error } = await db.from('files').select('*').order('id', { ascending: false });
            if (!error && data) {
                filesData = data;
                renderFiles();
            }
        }

        function renderFiles() {
            const container = document.getElementById('fileContainer');
            container.innerHTML = '';
            filesData.forEach((item) => {
                const card = document.createElement('a');
                card.className = 'file-card';
                card.href = isDeleteMode ? 'javascript:void(0)' : item.media_url;
                if(!isDeleteMode) card.target = "_blank";

                const bannerImg = item.banner_url ? `<img src="${item.banner_url}" class="banner">` : `<div class="banner">Banner</div>`;
                
                card.innerHTML = `
                    ${bannerImg}
                    <div class="file-info">
                        <div class="file-title">${item.title}</div>
                        <div class="file-desc">${item.description || 'mô tả...'}</div>
                    </div>
                    ${isDeleteMode ? `<button class="btn-card-del" onclick="deleteFile(${item.id})">Xóa</button>` : ''}
                `;
                container.appendChild(card);
            });
        }

        // Gửi câu hỏi cho AI
        async function sendAiQuestion() {
            const query = document.getElementById('aiInput').value.trim();
            if(!query) return;

            document.getElementById('aiResponse').innerText = "Đang suy nghĩ...";
            document.getElementById('aiModal').style.display = 'flex';

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: query }] }] })
                });
                const data = await res.json();
                const reply = data.candidates[0].content.parts[0].text;
                document.getElementById('aiResponse').innerText = reply;
            } catch(e) {
                document.getElementById('aiResponse').innerText = "Lỗi kết nối AI hoặc Key API!";
            }
        }

        // Chạm 3 lần Avatar & Vuốt 3 lần
        let avatarClicks = 0, clickTimer = null;
        document.getElementById('avatarBtn').addEventListener('click', () => {
            avatarClicks++;
            clearTimeout(clickTimer);
            if (avatarClicks === 3) {
                avatarClicks = 0;
                openPasswordModal('add');
            } else {
                clickTimer = setTimeout(() => avatarClicks = 0, 1000);
            }
        });

        let touchStartX = 0, touchEndX = 0;
        let swipeRightCount = 0, swipeLeftCount = 0, swipeTimer = null;

        document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            const diffX = touchEndX - touchStartX;
            if (Math.abs(diffX) < 50) return;

            clearTimeout(swipeTimer);
            swipeTimer = setTimeout(() => { swipeRightCount = 0; swipeLeftCount = 0; }, 1500);

            if (diffX < -50) { // Vuốt Phải -> Trái 3 lần
                swipeLeftCount++; swipeRightCount = 0;
                if (swipeLeftCount === 3) { swipeLeftCount = 0; openPasswordModal('add'); }
            } else if (diffX > 50) { // Vuốt Trái -> Phải 3 lần
                swipeRightCount++; swipeLeftCount = 0;
                if (swipeRightCount === 3) { swipeRightCount = 0; openPasswordModal('delete'); }
            }
        });

        function openPasswordModal(action) {
            pendingAction = action;
            document.getElementById('pwInput').value = '';
            document.getElementById('pwModal').style.display = 'flex';
        }

        function checkPassword() {
            if (document.getElementById('pwInput').value === AUTH_PASS) {
                closeModals();
                if (pendingAction === 'add') document.getElementById('adminModal').style.display = 'flex';
                else if (pendingAction === 'delete') { isDeleteMode = !isDeleteMode; renderFiles(); }
            } else alert("Mật khẩu không đúng!");
        }

        function closeModals() {
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        }

        // Thêm / Xóa File
        async function addNewFile() {
            const title = document.getElementById('fileTitle').value;
            const description = document.getElementById('fileDesc').value;
            const banner_url = document.getElementById('fileBanner').value;
            const media_url = document.getElementById('fileLink').value;

            if(!title || !media_url) return alert("Cần nhập Tên file và Link!");

            const { error } = await db.from('files').insert([{ title, description, banner_url, media_url }]);
            if(!error) {
                closeModals();
                loadFiles();
            } else alert("Lỗi khi thêm file!");
        }

        async function deleteFile(id) {
            if(!confirm("Xóa file này?")) return;
            const { error } = await db.from('files').delete().eq('id', id);
            if(!error) loadFiles();
        }

        loadFiles();
    </script>
</body>
</html>
