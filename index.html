<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MeoNeHero - Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: #02232d;
            background: linear-gradient(180deg, #022834 0%, #011822 40%, #000000 100%);
            color: #fff;
            font-family: 'VT323', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 15px 130px 15px;
            overflow-x: hidden;
            position: relative;
        }

        body::after {
            content: ''; position: fixed; bottom: -50px; left: 50%;
            transform: translateX(-50%); width: 120%; height: 180px;
            background: radial-gradient(ellipse at bottom, rgba(56, 189, 248, 0.35) 0%, rgba(255, 255, 255, 0.15) 35%, rgba(0,0,0,0) 70%);
            pointer-events: none; z-index: 1;
            animation: bottomGlow 4s ease-in-out infinite alternate;
        }

        @keyframes bottomGlow {
            0% { opacity: 0.7; transform: translateX(-50%) scale(0.98); }
            100% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }

        /* NAVBAR HEADER CÓ NÚT HAMBURGER MENU Ở GÓC PHẢI */
        .top-navbar {
            width: 100%; max-width: 380px; display: flex; justify-content: flex-end;
            align-items: center; margin-bottom: 5px; z-index: 10;
        }

        .menu-btn {
            width: 38px; height: 38px; background: rgba(56, 189, 248, 0.15);
            border: 1px solid #38bdf8; border-radius: 10px; display: flex;
            flex-direction: column; justify-content: center; align-items: center; gap: 4px;
            cursor: pointer; transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .menu-btn:active { transform: scale(0.85); background: rgba(56, 189, 248, 0.4); }
        .menu-bar { width: 20px; height: 2px; background: #38bdf8; border-radius: 2px; }

        /* SIDEBAR DRAWER MENU */
        .sidebar {
            position: fixed; top: 0; right: -280px; width: 260px; height: 100%;
            background: rgba(2, 24, 34, 0.98); border-left: 2px solid #38bdf8;
            box-shadow: -10px 0 30px rgba(0,0,0,0.8); backdrop-filter: blur(15px);
            z-index: 200; padding: 20px 15px; display: flex; flex-direction: column; gap: 15px;
            transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .sidebar.active { right: 0; }
        .sidebar-title { font-size: 24px; color: #38bdf8; border-bottom: 1px dashed #38bdf8; padding-bottom: 5px; }
        
        .search-box {
            background: #000; border: 1px solid #38bdf8; border-radius: 10px;
            padding: 8px; color: white; font-family: 'VT323', monospace; font-size: 18px; outline: none;
        }

        .sidebar-item {
            padding: 10px; background: rgba(255, 255, 255, 0.05); border-radius: 8px;
            color: #e2e8f0; cursor: pointer; transition: background 0.2s; text-align: center; font-size: 18px;
        }
        .sidebar-item:active { background: rgba(56, 189, 248, 0.2); }

        .profile {
            width: 100%; max-width: 380px; display: flex; align-items: center; gap: 15px;
            margin-bottom: 20px; z-index: 2; animation: fadeInProfile 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes fadeInProfile {
            0% { opacity: 0; transform: translateY(-15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .avatar-frame {
            width: 80px; height: 80px; border-radius: 50%; border: 2px solid #38bdf8;
            padding: 2px; flex-shrink: 0; cursor: pointer;
        }

        .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #000; }
        .profile-info { display: flex; flex-direction: column; }
        .username { font-size: 28px; font-weight: bold; color: #38bdf8; line-height: 1; }
        .subtext { font-size: 18px; color: #7dd3fc; margin-top: 2px; }
        .quote { font-size: 16px; color: #cbd5e1; }

        .file-list { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 14px; z-index: 2; }

        /* FILE CARD & HIỆU ỨNG TOẢ VIỀN XANH KHI ĐÃ BẬT ADMIN */
        .file-card {
            background: #000000; border: 2px solid #ffffff; border-radius: 35px;
            padding: 6px 15px 6px 6px; display: flex; align-items: center;
            text-decoration: none; color: inherit; position: relative; opacity: 0;
            transform: translateY(40px); animation: fadeInUpCard 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            transition: all 0.3s ease;
        }

        @keyframes fadeInUpCard {
            0% { opacity: 0; transform: translateY(50px) scale(0.92); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .file-card:active { transform: scale(0.96); }

        .file-card.long-pressed {
            border-color: #38bdf8;
            box-shadow: 0 0 20px #38bdf8, inset 0 0 10px #38bdf8;
        }

        .banner {
            width: 55px; height: 55px; border-radius: 50%; border: 2px solid #ffffff;
            background: #ffffff; color: #000000; display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: bold; flex-shrink: 0; overflow: hidden; object-fit: cover;
        }

        .file-info { margin-left: 12px; flex-grow: 1; }
        .file-title { font-size: 22px; color: #ffffff; line-height: 1; }
        .file-desc { font-size: 15px; color: #a1a1aa; margin-top: 2px; }

        .btn-card-action {
            color: white; border: 1px solid #fff; border-radius: 12px;
            padding: 3px 8px; font-family: 'VT323', monospace; font-size: 16px; cursor: pointer; margin-left: 4px;
        }
        .btn-edit { background: #0284c7; }
        .btn-del { background: #ef4444; }

        /* BẢNG AI RESPONSE TRƯỢT MƯỢT */
        .chat-container-wrapper {
            position: fixed; bottom: 20px; width: calc(100% - 30px); max-width: 380px;
            display: flex; flex-direction: column; align-items: center; z-index: 90;
        }

        .ai-response-popup {
            width: 100%; max-height: 0; opacity: 0; overflow: hidden;
            background: rgba(9, 19, 26, 0.95); border: 0px solid #38bdf8; border-radius: 20px;
            margin-bottom: 0px; padding: 0 15px; box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
            backdrop-filter: blur(12px); transition: all 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateY(35px) scale(0.9);
        }

        .ai-response-popup.active {
            max-height: 240px; opacity: 1; padding: 12px 15px; margin-bottom: 12px;
            border-width: 2px; transform: translateY(0) scale(1);
        }

        .response-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(56, 189, 248, 0.4); padding-bottom: 5px; margin-bottom: 8px; }
        .response-model-tag { font-size: 14px; color: #38bdf8; font-weight: bold; }
        .response-close { font-size: 18px; color: #94a3b8; cursor: pointer; }

        .response-text { font-size: 17px; color: #e2e8f0; max-height: 160px; overflow-y: auto; line-height: 1.2; word-break: break-word; }

        /* HIỆU ỨNG TRỒI NHẸ TỪ DƯỚI LÊN CHO TỪNG DÒNG AI (KHÔNG BỊ NẢY TO DẦN) */
        .ai-line {
            opacity: 0; transform: translateY(15px);
            animation: smoothSlideUp 0.3s ease-out forwards;
            margin-bottom: 4px;
        }

        @keyframes smoothSlideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* BAR CHAT */
        .ai-chat-bar {
            width: 100%; height: 48px;
            background: linear-gradient(90deg, rgba(42, 65, 58, 0.85) 0%, rgba(62, 79, 71, 0.85) 50%, rgba(79, 89, 91, 0.85) 100%);
            border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 25px;
            padding: 4px 6px 4px 12px; display: flex; align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7); backdrop-filter: blur(10px); position: relative;
        }

        .ai-input { flex-grow: 1; background: transparent; border: none; outline: none; color: #ffffff; font-family: 'VT323', monospace; font-size: 18px; }
        .ai-btn { width: 38px; height: 38px; background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%); border: 1.5px solid rgba(255, 255, 255, 0.7); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .ai-btn-arrow { width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 10px solid #ffffff; margin-left: 2px; }

        /* MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 300; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal-content { background: #09131a; border: 2px solid #38bdf8; border-radius: 20px; padding: 18px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.3); }
        .modal-title { font-size: 24px; color: #38bdf8; text-align: center; }
        .input-field { background: #000; border: 1px solid #ffffff; border-radius: 8px; padding: 8px 10px; color: white; outline: none; font-family: 'VT323', monospace; font-size: 18px; }
        .btn-submit { background: #0284c7; color: white; border: 1px solid #fff; border-radius: 8px; padding: 6px; font-family: 'VT323', monospace; font-size: 20px; cursor: pointer; }
        .btn-cancel { color: #94a3b8; text-align: center; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="top-navbar">
        <div class="menu-btn" onclick="toggleSidebar()">
            <div class="menu-bar"></div>
            <div class="menu-bar"></div>
            <div class="menu-bar"></div>
        </div>
    </div>

    <!-- SIDEBAR DRAWER MENU -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-title">Tìm Kiếm</div>
        <input type="text" class="search-box" placeholder="Nhập tên file..." oninput="filterFiles(this.value)">
        <div class="sidebar-item" onclick="toggleSidebar()">Đóng Menu</div>
    </div>

    <div class="profile">
        <div class="avatar-frame" id="avatarBtn">
            <img class="avatar" src="https://via.placeholder.com/100" alt="Avatar">
        </div>
        <div class="profile-info">
            <div class="username">MeoNeHero</div>
            <div class="subtext">~1500 Followers</div>
            <div class="quote">BadTimeSans gay v1</div>
        </div>
    </div>

    <div class="file-list" id="fileContainer"></div>

    <div class="chat-container-wrapper">
        <div class="ai-response-popup" id="aiResponseBox">
            <div class="response-header">
                <span class="response-model-tag" id="modelTag">[GROQ - Llama 3]</span>
                <span class="response-close" onclick="closeAiResponse()">✕</span>
            </div>
            <div class="response-text" id="aiResponseText"></div>
        </div>

        <div class="ai-chat-bar">
            <input type="text" id="aiInput" class="ai-input" placeholder="Hỏi AI (Groq / GPT-4o)...">
            <div class="ai-btn" onclick="sendAiQuestion()">
                <div class="ai-btn-arrow"></div>
            </div>
        </div>
    </div>

    <!-- MODAL XÁC THỰC MẬT KHẨU ADMIN -->
    <div class="modal" id="pwModal">
        <div class="modal-content">
            <div class="modal-title">Xác thực Admin</div>
            <input type="password" id="pwInput" class="input-field" placeholder="Nhập mật khẩu...">
            <button class="btn-submit" onclick="checkPassword()">Xác nhận</button>
            <div class="btn-cancel" onclick="closeModals()">Hủy</div>
        </div>
    </div>

    <!-- MODAL THÊM / SỬA FILE -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <div class="modal-title" id="formTitle">Thêm File Mới</div>
            <input type="hidden" id="editFileId">
            <input type="text" id="fileTitle" class="input-field" placeholder="Tên file">
            <input type="text" id="fileDesc" class="input-field" placeholder="Mô tả...">
            <input type="text" id="fileBanner" class="input-field" placeholder="Link ảnh Banner">
            <input type="text" id="fileLink" class="input-field" placeholder="Link Mediafire / Driver">
            <button class="btn-submit" onclick="saveFile()">Lưu File</button>
            <div class="btn-cancel" onclick="closeModals()">Đóng</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://uipjgdkasbcdhxlmzclc.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_XApMlu8Nm_kJF8ceuPvsQg_E-g19QwX";             
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const AUTH_PASS = "meoneheroundertale";

        let filesData = [];
        let isAdminMode = false;
        let pendingAction = null;
        let pressTimer = null;

        const mockFiles = [
            { id: 1, title: "Undertale Fan Game Mobile", description: "Bản port Android mượt mà 60fps", banner_url: "", media_url: "#" },
            { id: 2, title: "Dusttale Battle Mod Scratch", description: "File SB3 đã qua xử lý Turbowarp", banner_url: "", media_url: "#" },
            { id: 3, title: "Asset Sprite Pack 129 Sprites", description: "Trích xuất bằng MT Manager", banner_url: "", media_url: "#" }
        ];

        async function loadFiles() {
            const { data, error } = await db.from('files').select('*').order('id', { ascending: false });
            filesData = (!error && data && data.length > 0) ? data : mockFiles;
            renderFiles(filesData);
        }

        function renderFiles(list) {
            const container = document.getElementById('fileContainer');
            container.innerHTML = '';
            list.forEach((item, index) => {
                const card = document.createElement('a');
                card.className = 'file-card';
                card.href = isAdminMode ? 'javascript:void(0)' : item.media_url;
                if(!isAdminMode) card.target = "_blank";

                card.style.animationDelay = `${index * 0.1}s`;

                // CHỈ KHI BẬT ADMIN MODE THÌ NHẤN GIỮ MỚI HIỆN BẢNG SỬA FILE
                if (isAdminMode) {
                    card.addEventListener('touchstart', () => {
                        pressTimer = setTimeout(() => {
                            card.classList.add('long-pressed');
                            if (navigator.vibrate) navigator.vibrate(50);
                            setTimeout(() => {
                                openEditModal(item);
                                card.classList.remove('long-pressed');
                            }, 300);
                        }, 800);
                    });
                    card.addEventListener('touchend', () => clearTimeout(pressTimer));
                    card.addEventListener('touchmove', () => clearTimeout(pressTimer));
                }

                const bannerImg = item.banner_url ? `<img src="${item.banner_url}" class="banner">` : `<div class="banner">File</div>`;
                
                card.innerHTML = `
                    ${bannerImg}
                    <div class="file-info">
                        <div class="file-title">${item.title}</div>
                        <div class="file-desc">${item.description || 'mô tả...'}</div>
                    </div>
                    ${isAdminMode ? `
                        <button class="btn-card-action btn-edit" onclick="event.preventDefault(); openEditModalById(${item.id})">Sửa</button>
                        <button class="btn-card-action btn-del" onclick="event.preventDefault(); deleteFile(${item.id})">Xóa</button>
                    ` : ''}
                `;
                container.appendChild(card);
            });
        }

        /* HIỆU ỨNG AI XUẤT HIỆN TỪNG DÒNG TRỒI LÊN ÊM ÁI */
        function openAiResponseLineByLine(fullText, modelName) {
            document.getElementById('modelTag').innerText = `[${modelName}]`;
            const box = document.getElementById('aiResponseBox');
            const textElem = document.getElementById('aiResponseText');
            
            box.classList.add('active');
            textElem.innerHTML = "";

            const lines = fullText.split('\n');
            let lineIndex = 0;

            const lineInterval = setInterval(() => {
                if (lineIndex < lines.length) {
                    if (lines[lineIndex].trim() !== "") {
                        const lineDiv = document.createElement('div');
                        lineDiv.className = 'ai-line';
                        lineDiv.innerText = lines[lineIndex];
                        textElem.appendChild(lineDiv);
                        textElem.scrollTop = textElem.scrollHeight;
                    }
                    lineIndex++;
                } else {
                    clearInterval(lineInterval);
                }
            }, 150);
        }

        function closeAiResponse() {
            document.getElementById('aiResponseBox').classList.remove('active');
        }

        async function sendAiQuestion() {
            const query = document.getElementById('aiInput').value.trim();
            if(!query) return;

            openAiResponseLineByLine("Đang xử lý câu hỏi...\nVui lòng chờ trong giây lát...", "GROQ / GPT");

            setTimeout(() => {
                const sampleResponse = `Đã nhận câu hỏi: "${query}"\n-> Giao diện đã dọn dẹp sạch sẽ.\n-> Hiệu ứng trồi dòng AI đã mượt mà chuẩn bài.\n-> Chế độ Admin bảo mật an toàn tuyệt đối!`;
                openAiResponseLineByLine(sampleResponse, "Llama 3 Instant");
            }, 500);
        }

        /* GESTURE VUỐT 3 LẦN SANG PHẢI ĐỂ MỞ KHÓA ADMIN (CODE CŨ) */
        let touchStartX = 0, touchEndX = 0;
        let swipeRightCount = 0, swipeTimer = null;

        document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            const diffX = touchEndX - touchStartX;
            if (Math.abs(diffX) < 50) return;

            clearTimeout(swipeTimer);
            swipeTimer = setTimeout(() => { swipeRightCount = 0; }, 1500);

            if (diffX > 50) { 
                swipeRightCount++;
                if (swipeRightCount === 3) { 
                    swipeRightCount = 0; 
                    if (!isAdminMode) {
                        openPasswordModal('admin_mode');
                    } else {
                        isAdminMode = false;
                        alert("Đã TẮT chế độ Admin!");
                        renderFiles(filesData);
                    }
                }
            }
        });

        function openPasswordModal(action) {
            pendingAction = action;
            document.getElementById('pwInput').value = '';
            document.getElementById('pwModal').style.display = 'flex';
        }

        function checkPassword() {
            if (document.getElementById('pwInput').value === AUTH_PASS) {
                closeModals();
                if (pendingAction === 'admin_mode') {
                    isAdminMode = true;
                    alert("Đã BẬT chế độ Admin thành công!");
                    renderFiles(filesData);
                }
            } else {
                alert("Sai mật khẩu Admin!");
            }
        }

        /* DRAWER MENU 3 GẠCH */
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function filterFiles(keyword) {
            const filtered = filesData.filter(f => f.title.toLowerCase().includes(keyword.toLowerCase()));
            renderFiles(filtered);
        }

        function openEditModal(item) {
            document.getElementById('formTitle').innerText = "Chỉnh Sửa File";
            document.getElementById('editFileId').value = item.id;
            document.getElementById('fileTitle').value = item.title;
            document.getElementById('fileDesc').value = item.description || '';
            document.getElementById('fileBanner').value = item.banner_url || '';
            document.getElementById('fileLink').value = item.media_url || '';
            document.getElementById('adminModal').style.display = 'flex';
        }

        function openEditModalById(id) {
            const item = filesData.find(f => f.id === id);
            if(item) openEditModal(item);
        }

        async function saveFile() {
            const id = document.getElementById('editFileId').value;
            const title = document.getElementById('fileTitle').value;
            const description = document.getElementById('fileDesc').value;
            const banner_url = document.getElementById('fileBanner').value;
            const media_url = document.getElementById('fileLink').value;

            if(!title || !media_url) return alert("Vui lòng nhập Tên và Link!");

            if (id) {
                await db.from('files').update({ title, description, banner_url, media_url }).eq('id', id);
            } else {
                await db.from('files').insert([{ title, description, banner_url, media_url }]);
            }
            closeModals();
            loadFiles();
        }

        async function deleteFile(id) {
            if(!confirm("Xác nhận xóa file này?")) return;
            await db.from('files').delete().eq('id', id);
            loadFiles();
        }

        function closeModals() {
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
            const sidebar = document.getElementById('sidebar');
            if(sidebar.classList.contains('active')) sidebar.classList.remove('active');
        }

        loadFiles();
    </script>
</body>
</html>
