<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MeoNeHero - Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'VT323', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px 100px 15px;
            overflow-x: hidden;
            position: relative;
        }

        .bg-gif-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-gif {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile {
            width: 100%;
            max-width: 480px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
            margin-bottom: 25px;
            z-index: 2;
            animation: fadeInProfile 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes fadeInProfile {
            0% { opacity: 0; transform: translateY(-15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .avatar-frame {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #38bdf8;
            padding: 2px;
            flex-shrink: 0;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            background: #000;
        }

        .avatar-frame:active { transform: scale(0.9); box-shadow: 0 0 30px rgba(56, 189, 248, 0.9); }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #000;
        }

        .profile-info { display: flex; flex-direction: column; text-shadow: 2px 2px 4px #000; }
        .username { font-size: 30px; font-weight: bold; color: #e0f2fe; line-height: 1; letter-spacing: 0.5px; }
        .subtext { font-size: 18px; color: #94a3b8; margin-top: 2px; }
        .quote-label { font-size: 15px; color: #64748b; margin-top: 3px; }
        .quote { font-size: 16px; color: #ffffff; font-weight: bold; }

        .file-list {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 2;
        }

        .file-card {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #38bdf8;
            border-radius: 35px;
            padding: 6px 15px 6px 6px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: inherit;
            position: relative;
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            animation: fadeInUpCard 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            backdrop-filter: blur(12px);
            transition: transform 0.15s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 25px rgba(0,0,0,0.9);
        }

        .file-card:hover {
            border-color: #7dd3fc;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
        }

        @keyframes fadeInUpCard {
            0% { opacity: 0; transform: translateY(50px) scale(0.92); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .file-card:active { transform: scale(0.97); }

        .banner {
            width: 55px; height: 55px;
            border-radius: 50%;
            border: 2px solid #38bdf8;
            background: #1a2a3a;
            color: #ffffff;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: bold;
            flex-shrink: 0; overflow: hidden; object-fit: cover;
        }

        .file-info { margin-left: 14px; flex-grow: 1; }
        .file-title { font-size: 24px; color: #e0f2fe; line-height: 1; letter-spacing: 0.5px; }
        .file-desc { font-size: 16px; color: #94a3b8; margin-top: 2px; }

        .action-btns {
            display: flex;
            gap: 8px;
            margin-left: 6px;
        }

        .btn-card-edit {
            background: #eab308;
            color: #000000;
            border: 1.5px solid #fff;
            border-radius: 15px;
            padding: 2px 10px;
            font-family: 'VT323', monospace;
            font-size: 17px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }

        .btn-card-edit:active { transform: scale(0.9); box-shadow: 0 0 20px rgba(234, 179, 8, 0.5); }

        .btn-card-del {
            background: #dc2626;
            color: white;
            border: 1.5px solid #fff;
            border-radius: 15px;
            padding: 2px 10px;
            font-family: 'VT323', monospace;
            font-size: 17px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }

        .btn-card-del:active { transform: scale(0.9); box-shadow: 0 0 20px rgba(220, 38, 38, 0.5); }

        .modal {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.88);
            z-index: 101;
            justify-content: center; align-items: center;
            padding: 20px;
            animation: modalFadeIn 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes modalFadeIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .modal-content {
            background: #0a0a0a;
            border: 2px solid #38bdf8;
            border-radius: 20px;
            padding: 22px 20px;
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.15);
        }

        .modal-title {
            font-size: 26px;
            color: #38bdf8;
            text-align: center;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .input-field {
            background: #111;
            border: 1.5px solid #334155;
            border-radius: 10px;
            padding: 10px 12px;
            color: white;
            outline: none;
            font-family: 'VT323', monospace;
            font-size: 19px;
            transition: border-color 0.3s ease;
        }

        .input-field:focus { border-color: #38bdf8; }

        .btn-submit {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: white;
            border: 1.5px solid #fff;
            border-radius: 10px;
            padding: 8px;
            font-family: 'VT323', monospace;
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }

        .btn-submit:active { transform: scale(0.96); box-shadow: 0 0 30px rgba(14, 165, 233, 0.4); }

        .btn-cancel {
            color: #94a3b8;
            text-align: center;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .btn-cancel:hover { color: #e2e8f0; }

        /* RESPONSIVE TWEAK */
        @media (max-width: 480px) {
            .profile { max-width: 100%; }
            .file-list { max-width: 100%; }
            .username { font-size: 26px; }
            .file-title { font-size: 20px; }
            .banner { width: 48px; height: 48px; }
        }
    </style>
</head>
<body>

    <div class="bg-gif-container">
        <video autoplay loop muted playsinline id="customBg" class="bg-gif">
            <source src="https://files.catbox.moe/d7amrt.mp4" type="video/mp4">
        </video>
    </div>

    <div class="profile">
        <div class="avatar-frame" id="avatarBtn" title="Bấm 3 lần để mở Modal Admin">
            <img class="avatar" src="https://files.catbox.moe/8liyyh.jpg" alt="Avatar">
        </div>
        <div class="profile-info">
            <div class="username">MeoNeHero</div>
            <div class="subtext">1500 Followers</div>
            <div class="quote-label">câu nói để đời:</div>
            <div class="quote">BadTimeSans gay vl</div>
        </div>
    </div>

    <div class="file-list" id="fileContainer"></div>

    <div class="modal" id="adminModal">
        <div class="modal-content">
            <div class="modal-title" id="modalActionTitle">Thêm File Mới</div>
            <input type="hidden" id="editFileId">
            <input type="text" id="fileTitle" class="input-field" placeholder="Tên file">
            <input type="text" id="fileDesc" class="input-field" placeholder="Mô tả...">
            <input type="text" id="fileBanner" class="input-field" placeholder="Link ảnh Banner">
            <input type="text" id="fileLink" class="input-field" placeholder="Link Mediafire / Lưu trữ">
            <button class="btn-submit" id="btnSaveFile" onclick="saveFile()">Đăng File</button>
            <div class="btn-cancel" onclick="closeModals()">Đóng</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://uipjgdkasbcdhxlmzclc.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_XApMlu8Nm_kJF8ceuPvsQg_E-g19QwX";             
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let filesData = [];
        let isManageMode = false;

        // --- LOAD FILES ---
        async function loadFiles() {
            const { data, error } = await db.from('files').select('*').order('id', { ascending: false });
            filesData = (!error && data) ? data : [];
            renderFiles();
        }

        function renderFiles() {
            const container = document.getElementById('fileContainer');
            container.innerHTML = '';
            
            if (filesData.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#64748b; font-size:20px;">Chưa có file nào...</div>';
                return;
            }

            filesData.forEach((item, index) => {
                const card = document.createElement('a');
                card.className = 'file-card';
                card.href = isManageMode ? 'javascript:void(0)' : (item.media_url || '#');
                if(!isManageMode) card.target = "_blank";
                card.style.animationDelay = `${index * 0.08}s`;

                const bannerImg = item.banner_url ? `<img src="${item.banner_url}" class="banner">` : `<div class="banner">📁</div>`;
                
                card.innerHTML = `
                    ${bannerImg}
                    <div class="file-info">
                        <div class="file-title">${item.title}</div>
                        <div class="file-desc">${item.description || '📄 Không có mô tả'}</div>
                    </div>
                    ${isManageMode ? `
                        <div class="action-btns">
                            <button class="btn-card-edit" onclick="event.stopPropagation(); openEditModal(${item.id})">✎</button>
                            <button class="btn-card-del" onclick="event.stopPropagation(); deleteFile(${item.id})">✕</button>
                        </div>
                    ` : ''}
                `;
                container.appendChild(card);
            });
        }

        // --- CLICK AVATAR (Nhấp 3 lần để mở Modal Admin) ---
        let avatarClicks = 0, clickTimer = null;
        document.getElementById('avatarBtn').addEventListener('click', () => {
            avatarClicks++;
            clearTimeout(clickTimer);
            if (avatarClicks === 3) {
                avatarClicks = 0;
                openAddModal();
            } else {
                clickTimer = setTimeout(() => { avatarClicks = 0; }, 400);
            }
        });

        // --- HỖ TRỢ BẤM PHÍM TẮT CHO PC (M - Toggle chế độ Quản lý, A - Mở modal Thêm) ---
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return; // Không kích hoạt khi đang gõ chữ
            if (e.key.toLowerCase() === 'm') {
                isManageMode = !isManageMode;
                renderFiles();
            } else if (e.key.toLowerCase() === 'a') {
                openAddModal();
            }
        });

        // --- SWIPE TOUCH CỦ CỬ CHỈ (Vuốt trái: Thêm file, Vuốt phải: Bật/Tắt chế độ Quản lý) ---
        let touchStartX = 0, touchEndX = 0;
        let swipeRightCount = 0, swipeLeftCount = 0, swipeTimer = null;

        document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            const diffX = touchEndX - touchStartX;
            if (Math.abs(diffX) < 50) return;

            clearTimeout(swipeTimer);
            swipeTimer = setTimeout(() => { swipeRightCount = 0; swipeLeftCount = 0; }, 1500);

            if (diffX < -50) { 
                swipeLeftCount++; swipeRightCount = 0;
                if (swipeLeftCount === 3) { 
                    swipeLeftCount = 0; 
                    openAddModal(); 
                }
            } else if (diffX > 50) { 
                swipeRightCount++; swipeLeftCount = 0;
                if (swipeRightCount === 3) { 
                    swipeRightCount = 0; 
                    isManageMode = !isManageMode; 
                    renderFiles(); 
                }
            }
        });

        // --- MODAL FUNCTIONS ---
        function closeModals() {
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        }

        function openAddModal() {
            document.getElementById('modalActionTitle').innerText = "➕ Thêm File Mới";
            document.getElementById('btnSaveFile').innerText = "Đăng File";
            document.getElementById('editFileId').value = "";
            document.getElementById('fileTitle').value = "";
            document.getElementById('fileDesc').value = "";
            document.getElementById('fileBanner').value = "";
            document.getElementById('fileLink').value = "";
            document.getElementById('adminModal').style.display = 'flex';
        }

        function openEditModal(id) {
            const item = filesData.find(f => f.id === id);
            if(!item) return;

            document.getElementById('modalActionTitle').innerText = "✎ Chỉnh Sửa File";
            document.getElementById('btnSaveFile').innerText = "Lưu Thay Đổi";
            document.getElementById('editFileId').value = item.id;
            document.getElementById('fileTitle').value = item.title;
            document.getElementById('fileDesc').value = item.description || "";
            document.getElementById('fileBanner').value = item.banner_url || "";
            document.getElementById('fileLink').value = item.media_url || "";
            document.getElementById('adminModal').style.display = 'flex';
        }

        async function saveFile() {
            const id = document.getElementById('editFileId').value;
            const title = document.getElementById('fileTitle').value.trim();
            const description = document.getElementById('fileDesc').value.trim();
            const banner_url = document.getElementById('fileBanner').value.trim();
            const media_url = document.getElementById('fileLink').value.trim();

            if(!title || !media_url) return alert("⚠️ Cần nhập Tên file và Link!");

            if(id) {
                const { error } = await db.from('files').update({ title, description, banner_url, media_url }).eq('id', id);
                if(!error) { closeModals(); loadFiles(); } 
                else alert("❌ Lỗi khi cập nhật file: " + error.message);
            } else {
                const { error } = await db.from('files').insert([{ title, description, banner_url, media_url }]);
                if(!error) { closeModals(); loadFiles(); } 
                else alert("❌ Lỗi khi thêm file: " + error.message);
            }
        }

        async function deleteFile(id) {
            if(!confirm("🗑️ Xóa file này?")) return;
            const { error } = await db.from('files').delete().eq('id', id);
            if(!error) loadFiles();
            else alert("❌ Lỗi khi xóa file: " + error.message);
        }

        loadFiles();
    </script>
</body>
</html>
