<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MeoNeHero - Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body {
            background: #02232d;
            background: linear-gradient(180deg, #022834 0%, #011822 40%, #000000 100%);
            color: #fff;
            font-family: 'VT323', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 15px 130px 15px;
            overflow-x: hidden;
            position: relative;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 120%;
            height: 180px;
            background: radial-gradient(ellipse at bottom, rgba(56, 189, 248, 0.35) 0%, rgba(255, 255, 255, 0.15) 35%, rgba(0,0,0,0) 70%);
            pointer-events: none;
            z-index: 1;
            animation: bottomGlow 4s ease-in-out infinite alternate;
        }

        @keyframes bottomGlow {
            0% { opacity: 0.7; transform: translateX(-50%) scale(0.98); }
            100% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }

        .profile {
            width: 100%;
            max-width: 380px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 5px;
            margin-bottom: 20px;
            z-index: 2;
            animation: fadeInProfile 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes fadeInProfile {
            0% { opacity: 0; transform: translateY(-15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .avatar-frame {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #38bdf8;
            padding: 2px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #000;
        }

        .profile-info { display: flex; flex-direction: column; }
        .username { font-size: 28px; font-weight: bold; color: #38bdf8; line-height: 1; letter-spacing: 0.5px; }
        .subtext { font-size: 18px; color: #7dd3fc; margin-top: 2px; }
        .quote-label { font-size: 15px; color: #94a3b8; margin-top: 3px; }
        .quote { font-size: 16px; color: #cbd5e1; }

        .file-list {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 2;
        }

        .file-card {
            background: #000000;
            border: 2px solid #ffffff;
            border-radius: 35px;
            padding: 6px 15px 6px 6px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: inherit;
            position: relative;
            opacity: 0;
            transform: translateY(40px);
            animation: fadeInUpCard 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            transition: transform 0.1s ease;
        }

        @keyframes fadeInUpCard {
            0% {
                opacity: 0;
                transform: translateY(50px) scale(0.92);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .file-card:active { transform: scale(0.97); }

        .banner {
            width: 55px; height: 55px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            background: #ffffff;
            color: #000000;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: bold;
            flex-shrink: 0; overflow: hidden; object-fit: cover;
        }

        .file-info { margin-left: 12px; flex-grow: 1; }
        .file-title { font-size: 22px; color: #ffffff; line-height: 1; }
        .file-desc { font-size: 15px; color: #a1a1aa; margin-top: 2px; }

        .btn-card-del {
            background: #ef4444; color: white;
            border: 1px solid #fff; border-radius: 15px;
            padding: 2px 8px; font-family: 'VT323', monospace;
            font-size: 16px; cursor: pointer; margin-left: 6px;
        }

        .chat-container-wrapper {
            position: fixed;
            bottom: 20px;
            width: calc(100% - 30px);
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 90;
        }

        .ai-response-popup {
            width: 100%;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            background: rgba(9, 19, 26, 0.95);
            border: 0px solid #38bdf8;
            border-radius: 20px;
            margin-bottom: 0px;
            padding: 0 15px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
            backdrop-filter: blur(12px);
            transition: all 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateY(35px) scale(0.9);
        }

        .ai-response-popup.active {
            max-height: 240px;
            opacity: 1;
            padding: 12px 15px;
            margin-bottom: 12px;
            border-width: 2px;
            transform: translateY(0) scale(1);
        }

        .response-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed rgba(56, 189, 248, 0.4);
            padding-bottom: 5px;
            margin-bottom: 8px;
        }

        .response-model-tag { font-size: 14px; color: #38bdf8; font-weight: bold; }
        .response-close { font-size: 18px; color: #94a3b8; cursor: pointer; }

        .response-text {
            font-size: 17px;
            color: #e2e8f0;
            max-height: 160px;
            overflow-y: auto;
            line-height: 1.2;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .typing-cursor::after {
            content: ' ';
            color: #38bdf8;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .ai-chat-bar {
            width: 100%;
            height: 48px;
            background: linear-gradient(90deg, rgba(42, 65, 58, 0.85) 0%, rgba(62, 79, 71, 0.85) 50%, rgba(79, 89, 91, 0.85) 100%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 25px;
            padding: 4px 6px 4px 12px;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            position: relative;
        }

        .ai-icon-plus {
            font-size: 22px;
            color: #38bdf8;
            margin-right: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            transition: background 0.2s;
        }

        .ai-icon-plus:active { background: rgba(56, 189, 248, 0.3); }

        .ai-input {
            flex-grow: 1;
            background: transparent;
            border: none; outline: none;
            color: #ffffff;
            font-family: 'VT323', monospace;
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        .ai-input::placeholder { color: rgba(255, 255, 255, 0.45); font-size: 16px; }

        .ai-btn {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
            border: 1.5px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }

        .ai-btn:active { transform: scale(0.9); }
        .ai-btn-arrow {
            width: 0; height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 10px solid #ffffff;
            margin-left: 2px;
        }

        .model-selector-menu {
            display: none;
            position: absolute;
            bottom: 58px; left: 10px;
            background: #09131a;
            border: 1px solid #38bdf8;
            border-radius: 12px;
            padding: 5px;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            z-index: 100;
        }

        .model-opt {
            padding: 6px 12px;
            font-size: 16px;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
        }

        .model-opt.active { background: #0284c7; font-weight: bold; }

        .modal {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 100;
            justify-content: center; align-items: center; padding: 20px;
        }

        .modal-content {
            background: #09131a; border: 2px solid #ffffff;
            border-radius: 20px; padding: 18px;
            width: 100%; max-width: 340px;
            display: flex; flex-direction: column; gap: 10px;
        }

        .modal-title { font-size: 24px; color: #38bdf8; text-align: center; }

        .input-field {
            background: #000; border: 1px solid #ffffff;
            border-radius: 8px; padding: 8px 10px;
            color: white; outline: none;
            font-family: 'VT323', monospace; font-size: 18px;
        }

        .btn-submit {
            background: #0284c7; color: white;
            border: 1px solid #fff; border-radius: 8px;
            padding: 6px; font-family: 'VT323', monospace;
            font-size: 20px; cursor: pointer;
        }

        .btn-cancel { color: #94a3b8; text-align: center; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="profile">
        <div class="avatar-frame" id="avatarBtn">
            <img class="avatar" src="https://files.catbox.moe/8liyyh.jpg" alt="Avatar">
        </div>
        <div class="profile-info">
            <div class="username">MeoNeHero</div>
            <div class="subtext">1500 Followers</div>
            <div class="quote-label">câu nói để đời:</div>
            <div class="quote">BadTimeSans gay vl</div>
        </div>
    </div>

    <div class="file-list" id="fileContainer"></div>

    <div class="chat-container-wrapper">
        <div class="ai-response-popup" id="aiResponseBox">
            <div class="response-header">
                <span class="response-model-tag" id="modelTag">[GROQ - Llama 3]</span>
                <span class="response-close" onclick="closeAiResponse()">✕</span>
            </div>
            <div class="response-text typing-cursor" id="aiResponseText">...</div>
        </div>

        <div class="ai-chat-bar">
            <span class="ai-icon-plus" id="btnToggleModel" onclick="toggleModelMenu()">+</span>
            <input type="text" id="aiInput" class="ai-input" placeholder="Hỏi AI (Groq / GPT-4o)...">
            <div class="ai-btn" onclick="sendAiQuestion()">
                <div class="ai-btn-arrow"></div>
            </div>

            <div class="model-selector-menu" id="modelMenu">
                <div class="model-opt active" id="opt-groq" onclick="selectModel('groq')">Groq (Llama 3)</div>
                <div class="model-opt" id="opt-gpt4o" onclick="selectModel('gpt4o')">GPT-4o (OpenRouter)</div>
            </div>
        </div>
    </div>

    <div class="modal" id="pwModal">
        <div class="modal-content">
            <div class="modal-title">Xác thực Admin</div>
            <input type="password" id="pwInput" class="input-field" placeholder="Nhập mật khẩu...">
            <button class="btn-submit" onclick="checkPassword()">Xác nhận</button>
            <div class="btn-cancel" onclick="closeModals()">Hủy</div>
        </div>
    </div>

    <div class="modal" id="adminModal">
        <div class="modal-content">
            <div class="modal-title">Thêm File Mới</div>
            <input type="text" id="fileTitle" class="input-field" placeholder="Tên file">
            <input type="text" id="fileDesc" class="input-field" placeholder="Mô tả...">
            <input type="text" id="fileBanner" class="input-field" placeholder="Link ảnh Banner">
            <input type="text" id="fileLink" class="input-field" placeholder="Link Mediafire / Lưu trữ">
            <button class="btn-submit" onclick="addNewFile()">Đăng File</button>
            <div class="btn-cancel" onclick="closeModals()">Đóng</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://uipjgdkasbcdhxlmzclc.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_XApMlu8Nm_kJF8ceuPvsQg_E-g19QwX";             
        
        // CẦN TẠO VÀ DÁN KEY MỚI VÀO ĐÂY (KEY CŨ ĐÃ BỊ HỦY DO NỔI TRÊN GITHUB)
        const GROQ_API_KEY = ""; 
        const OPENROUTER_API_KEY = ""; 

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const AUTH_PASS = "meoneheroundertale";

        let filesData = [];
        let isDeleteMode = false;
        let pendingAction = null;
        let currentModel = 'groq';
        let currentController = null;

        async function loadFiles() {
            const { data, error } = await db.from('files').select('*').order('id', { ascending: false });
            if (!error && data) {
                filesData = data;
            } else {
                filesData = [];
            }
            renderFiles();
        }

        function renderFiles() {
            const container = document.getElementById('fileContainer');
            container.innerHTML = '';
            filesData.forEach((item, index) => {
                const card = document.createElement('a');
                card.className = 'file-card';
                card.href = isDeleteMode ? 'javascript:void(0)' : item.media_url;
                if(!isDeleteMode) card.target = "_blank";

                card.style.animationDelay = `${index * 0.12}s`;

                const bannerImg = item.banner_url ? `<img src="${item.banner_url}" class="banner">` : `<div class="banner">Banner</div>`;
                
                card.innerHTML = `
                    ${bannerImg}
                    <div class="file-info">
                        <div class="file-title">${item.title}</div>
                        <div class="file-desc">${item.description || 'mô tả...'}</div>
                    </div>
                    ${isDeleteMode ? `<button class="btn-card-del" onclick="deleteFile(${item.id})">Xóa</button>` : ''}
                `;
                container.appendChild(card);
            });
        }

        function toggleModelMenu() {
            const menu = document.getElementById('modelMenu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }

        function selectModel(model) {
            currentModel = model;
            document.querySelectorAll('.model-opt').forEach(el => el.classList.remove('active'));
            document.getElementById(`opt-${model}`).classList.add('active');
            toggleModelMenu();
        }

        function closeAiResponse() {
            if (currentController) currentController.abort();
            document.getElementById('aiResponseBox').classList.remove('active');
        }

        async function sendAiQuestion() {
            const inputElem = document.getElementById('aiInput');
            const query = inputElem.value.trim();
            if(!query) return;

            const modelLabel = currentModel === 'groq' ? 'GROQ - Llama 3.1' : 'GPT-4o';
            document.getElementById('modelTag').innerText = `[${modelLabel}]`;
            
            const box = document.getElementById('aiResponseBox');
            const textElem = document.getElementById('aiResponseText');
            
            box.classList.add('active');
            textElem.classList.add('typing-cursor');
            textElem.innerText = "";
            inputElem.value = "";

            const apiKey = currentModel === 'groq' ? GROQ_API_KEY : OPENROUTER_API_KEY;

            if (!apiKey) {
                textElem.innerText = "Lỗi: Chưa nhập API Key mới! (Key cũ đã bị hủy do lộ mã nguồn).";
                textElem.classList.remove('typing-cursor');
                return;
            }

            if (currentController) currentController.abort();
            currentController = new AbortController();

            const endpoint = currentModel === 'groq' 
                ? "https://api.groq.com/openai/v1/chat/completions" 
                : "https://openrouter.ai/api/v1/chat/completions";

            const payloadModel = currentModel === 'groq' ? "llama-3.1-8b-instant" : "openai/gpt-4o";

            try {
                const res = await fetch(endpoint, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: payloadModel,
                        messages: [{ role: "user", content: query }],
                        stream: true
                    }),
                    signal: currentController.signal
                });

                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split("\n");
                    buffer = lines.pop(); 

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (trimmed.startsWith("data: ")) {
                            const dataStr = trimmed.replace("data: ", "");
                            if (dataStr === "[DONE]") break;
                            try {
                                const parsed = JSON.parse(dataStr);
                                const content = parsed.choices[0]?.delta?.content || "";
                                textElem.innerText += content;
                                textElem.scrollTop = textElem.scrollHeight;
                            } catch (err) {}
                        }
                    }
                }
            } catch (e) {
                if (e.name !== 'AbortError') {
                    textElem.innerText = "\n[Lỗi kết nối API hoặc Key không hợp lệ]";
                }
            } finally {
                textElem.classList.remove('typing-cursor');
            }
        }

        let avatarClicks = 0, clickTimer = null;
        document.getElementById('avatarBtn').addEventListener('click', () => {
            avatarClicks++;
            clearTimeout(clickTimer);
            if (avatarClicks === 3) {
                avatarClicks = 0;
                openPasswordModal('add');
            } else {
                clickTimer = setTimeout(() => avatarClicks = 0, 1000);
            }
        });

        let touchStartX = 0, touchEndX = 0;
        let swipeRightCount = 0, swipeLeftCount = 0, swipeTimer = null;

        document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            const diffX = touchEndX - touchStartX;
            if (Math.abs(diffX) < 50) return;

            clearTimeout(swipeTimer);
            swipeTimer = setTimeout(() => { swipeRightCount = 0; swipeLeftCount = 0; }, 1500);

            if (diffX < -50) { 
                swipeLeftCount++; swipeRightCount = 0;
                if (swipeLeftCount === 3) { swipeLeftCount = 0; openPasswordModal('add'); }
            } else if (diffX > 50) { 
                swipeRightCount++; swipeLeftCount = 0;
                if (swipeRightCount === 3) { swipeRightCount = 0; openPasswordModal('delete'); }
            }
        });

        function openPasswordModal(action) {
            pendingAction = action;
            document.getElementById('pwInput').value = '';
            document.getElementById('pwModal').style.display = 'flex';
        }

        function checkPassword() {
            if (document.getElementById('pwInput').value === AUTH_PASS) {
                closeModals();
                if (pendingAction === 'add') document.getElementById('adminModal').style.display = 'flex';
                else if (pendingAction === 'delete') { isDeleteMode = !isDeleteMode; renderFiles(); }
            } else alert("Mật khẩu không đúng!");
        }

        function closeModals() {
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        }

        async function addNewFile() {
            const title = document.getElementById('fileTitle').value;
            const description = document.getElementById('fileDesc').value;
            const banner_url = document.getElementById('fileBanner').value;
            const media_url = document.getElementById('fileLink').value;

            if(!title || !media_url) return alert("Cần nhập Tên file và Link!");

            const { error } = await db.from('files').insert([{ title, description, banner_url, media_url }]);
            if(!error) {
                closeModals();
                loadFiles();
            } else alert("Lỗi khi thêm file!");
        }

        async function deleteFile(id) {
            if(!confirm("Xóa file này?")) return;
            const { error } = await db.from('files').delete().eq('id', id);
            if(!error) loadFiles();
        }

        loadFiles();
    </script>
</body>
</html>
