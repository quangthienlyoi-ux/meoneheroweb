<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MeoNeHero - Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: #050508;
            color: #fff;
            font-family: 'VT323', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px 120px 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* 1. HÀNG NGHÌN NGOĨ SAO (STARFIELD BACKGROUND) */
        .stars-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: twinkle linear infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* 2. CỤM 7 NGOĨ SAO 7 MÀU SOULS XOAY TRÒN Ở GIỮA MÀN HÌNH */
        .soul-stars-center {
            position: fixed;
            top: 40%;
            left: 50%;
            width: 180px;
            height: 180px;
            margin-top: -90px;
            margin-left: -90px;
            pointer-events: none;
            z-index: 0;
            animation: rotateSouls 12s linear infinite;
        }

        @keyframes rotateSouls {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .soul-star {
            position: absolute;
            top: 50%; left: 50%;
            width: 14px; height: 14px;
            margin: -7px;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: pulseSoul 2s ease-in-out infinite alternate;
        }

        @keyframes pulseSoul {
            0% { transform: scale(0.8); filter: drop-shadow(0 0 4px currentColor); }
            100% { transform: scale(1.4); filter: drop-shadow(0 0 12px currentColor); }
        }

        /* Vị trí 7 ngôi sao theo vòng tròn & Màu sắc 7 Souls Undertale */
        .soul-red    { transform: rotate(0deg) translate(75px) rotate(0deg); background: #ff0000; color: #ff0000; }
        .soul-orange { transform: rotate(51.4deg) translate(75px) rotate(-51.4deg); background: #ff7a00; color: #ff7a00; }
        .soul-yellow { transform: rotate(102.8deg) translate(75px) rotate(-102.8deg); background: #ffff00; color: #ffff00; }
        .soul-green  { transform: rotate(154.2deg) translate(75px) rotate(-154.2deg); background: #00ff00; color: #00ff00; }
        .soul-cyan   { transform: rotate(205.6deg) translate(75px) rotate(-205.6deg); background: #00ffff; color: #00ffff; }
        .soul-blue   { transform: rotate(257deg) translate(75px) rotate(-257deg); background: #0044ff; color: #0044ff; }
        .soul-purple { transform: rotate(308.4deg) translate(75px) rotate(-308.4deg); background: #b000ff; color: #b000ff; }

        /* 3. HIỆU ỨNG LÔNG VŨ / SÓNG MỀM AM VỚI DẢI MÀU 7 SOULS Ở ĐÁY TRANG */
        @keyframes soulShift {
            0%   { fill: #ff0000; }
            14%  { fill: #ff7a00; }
            28%  { fill: #ffff00; }
            42%  { fill: #00ff00; }
            56%  { fill: #00ffff; }
            70%  { fill: #0044ff; }
            84%  { fill: #b000ff; }
            100% { fill: #ff0000; }
        }

        .feather-waves-container {
            position: fixed;
            bottom: 0; left: 0;
            width: 100vw;
            height: 220px;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .feather-wave {
            position: absolute;
            bottom: 0; left: 0;
            width: 200%;
            height: 100%;
            animation: soulShift 14s linear infinite;
        }

        .wave1 {
            opacity: 0.35;
            animation: waveMove 8s ease-in-out infinite alternate, soulShift 14s linear infinite;
            filter: blur(8px);
        }

        .wave2 {
            opacity: 0.6;
            animation: waveMove 5s ease-in-out infinite alternate-reverse, soulShift 14s linear infinite 2s;
            filter: blur(4px);
        }

        .wave3 {
            opacity: 0.85;
            animation: waveMove 3.5s ease-in-out infinite alternate, soulShift 14s linear infinite 4s;
        }

        @keyframes waveMove {
            0% { transform: translateX(0) scaleY(1); }
            100% { transform: translateX(-50%) scaleY(1.2); }
        }

        /* PROFILE HEADER */
        .profile {
            width: 100%;
            max-width: 380px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
            margin-bottom: 25px;
            z-index: 2;
            animation: fadeInProfile 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes fadeInProfile {
            0% { opacity: 0; transform: translateY(-15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .avatar-frame {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            padding: 2px;
            flex-shrink: 0;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: #000;
        }

        .avatar-frame:active { transform: scale(0.9); }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #000;
        }

        .profile-info { display: flex; flex-direction: column; text-shadow: 2px 2px 4px #000; }
        .username { font-size: 28px; font-weight: bold; color: #ffffff; line-height: 1; letter-spacing: 0.5px; }
        .subtext { font-size: 18px; color: #cbd5e1; margin-top: 2px; }
        .quote-label { font-size: 15px; color: #94a3b8; margin-top: 3px; }
        .quote { font-size: 16px; color: #ffffff; font-weight: bold; }

        /* DANH SÁCH FILE LINKS */
        .file-list {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 2;
        }

        .file-card {
            background: rgba(0, 0, 0, 0.88);
            border: 2px solid #ffffff;
            border-radius: 35px;
            padding: 6px 15px 6px 6px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: inherit;
            position: relative;
            opacity: 0;
            transform: translateY(40px);
            animation: fadeInUpCard 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            backdrop-filter: blur(8px);
            transition: transform 0.1s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        @keyframes fadeInUpCard {
            0% { opacity: 0; transform: translateY(50px) scale(0.92); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .file-card:active { transform: scale(0.97); }

        .banner {
            width: 55px; height: 55px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            background: #ffffff;
            color: #000000;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: bold;
            flex-shrink: 0; overflow: hidden; object-fit: cover;
        }

        .file-info { margin-left: 12px; flex-grow: 1; }
        .file-title { font-size: 22px; color: #ffffff; line-height: 1; }
        .file-desc { font-size: 15px; color: #a1a1aa; margin-top: 2px; }

        .btn-card-del {
            background: #ef4444; color: white;
            border: 1px solid #fff; border-radius: 15px;
            padding: 2px 8px; font-family: 'VT323', monospace;
            font-size: 16px; cursor: pointer; margin-left: 6px;
        }

        /* MODAL ADMIN */
        .modal {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 101;
            justify-content: center; align-items: center; padding: 20px;
        }

        .modal-content {
            background: #000000; border: 2px solid #ffffff;
            border-radius: 20px; padding: 18px;
            width: 100%; max-width: 340px;
            display: flex; flex-direction: column; gap: 10px;
        }

        .modal-title { font-size: 24px; color: #ffff00; text-align: center; }

        .input-field {
            background: #111; border: 1px solid #ffffff;
            border-radius: 8px; padding: 8px 10px;
            color: white; outline: none;
            font-family: 'VT323', monospace; font-size: 18px;
        }

        .btn-submit {
            background: #ff0000; color: white;
            border: 1px solid #fff; border-radius: 8px;
            padding: 6px; font-family: 'VT323', monospace;
            font-size: 20px; cursor: pointer;
        }

        .btn-cancel { color: #94a3b8; text-align: center; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 1. HÀNG NGHÌN NGOĨ SAO NỀN -->
    <div class="stars-container" id="starsContainer"></div>

    <!-- 2. CỤM 7 NGOĨ SAO 7 MÀU UNDERTALE SOULS XOAY TRÒN -->
    <div class="soul-stars-center">
        <div class="soul-star soul-red"></div>
        <div class="soul-star soul-orange"></div>
        <div class="soul-star soul-yellow"></div>
        <div class="soul-star soul-green"></div>
        <div class="soul-star soul-cyan"></div>
        <div class="soul-star soul-blue"></div>
        <div class="soul-star soul-purple"></div>
    </div>

    <!-- 3. HIỆU ỨNG SÓNG LÔNG VŨ MỀM AM CHUYỂN 7 MÀU SOULS Ở ĐÁY MÀN HÌNH -->
    <div class="feather-waves-container">
        <svg class="feather-wave wave1" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,0 C150,90 350,-40 500,40 C650,120 900,10 1200,60 L1200,120 L0,120 Z"></path>
        </svg>
        <svg class="feather-wave wave2" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,30 C200,100 450,10 600,70 C800,130 1000,20 1200,50 L1200,120 L0,120 Z"></path>
        </svg>
        <svg class="feather-wave wave3" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,50 C180,10 380,80 550,30 C750,-20 950,90 1200,20 L1200,120 L0,120 Z"></path>
        </svg>
    </div>

    <!-- PROFILE HEADER -->
    <div class="profile">
        <div class="avatar-frame" id="avatarBtn">
            <img class="avatar" src="https://files.catbox.moe/8liyyh.jpg" alt="Avatar">
        </div>
        <div class="profile-info">
            <div class="username">MeoNeHero</div>
            <div class="subtext">1500 Followers</div>
            <div class="quote-label">câu nói để đời:</div>
            <div class="quote">BadTimeSans gay vl</div>
        </div>
    </div>

    <!-- DANH SÁCH FILES -->
    <div class="file-list" id="fileContainer"></div>

    <!-- MODALS ADMIN -->
    <div class="modal" id="pwModal">
        <div class="modal-content">
            <div class="modal-title">Xác thực Admin</div>
            <input type="password" id="pwInput" class="input-field" placeholder="Nhập mật khẩu...">
            <button class="btn-submit" onclick="checkPassword()">Xác nhận</button>
            <div class="btn-cancel" onclick="closeModals()">Hủy</div>
        </div>
    </div>

    <div class="modal" id="adminModal">
        <div class="modal-content">
            <div class="modal-title">Thêm File Mới</div>
            <input type="text" id="fileTitle" class="input-field" placeholder="Tên file">
            <input type="text" id="fileDesc" class="input-field" placeholder="Mô tả...">
            <input type="text" id="fileBanner" class="input-field" placeholder="Link ảnh Banner">
            <input type="text" id="fileLink" class="input-field" placeholder="Link Mediafire / Lưu trữ">
            <button class="btn-submit" onclick="addNewFile()">Đăng File</button>
            <div class="btn-cancel" onclick="closeModals()">Đóng</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://uipjgdkasbcdhxlmzclc.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_XApMlu8Nm_kJF8ceuPvsQg_E-g19QwX";             
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const AUTH_PASS = "meoneheroundertale";

        let filesData = [];
        let isDeleteMode = false;
        let pendingAction = null;

        // --- GENERATE HÀNG NGHÌN NGÔI SAO ---
        function generateStarfield() {
            const container = document.getElementById('starsContainer');
            const count = 300; // Số lượng sao tối ưu mượt mà trên mobile
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.top = `${Math.random() * 100}vh`;
                star.style.left = `${Math.random() * 100}vw`;
                star.style.animationDuration = `${Math.random() * 3 + 1.5}s`;
                star.style.animationDelay = `${Math.random() * 3}s`;
                container.appendChild(star);
            }
        }
        generateStarfield();

        // --- LOAD FILES ---
        async function loadFiles() {
            const { data, error } = await db.from('files').select('*').order('id', { ascending: false });
            filesData = (!error && data) ? data : [];
            renderFiles();
        }

        function renderFiles() {
            const container = document.getElementById('fileContainer');
            container.innerHTML = '';
            filesData.forEach((item, index) => {
                const card = document.createElement('a');
                card.className = 'file-card';
                card.href = isDeleteMode ? 'javascript:void(0)' : item.media_url;
                if(!isDeleteMode) card.target = "_blank";
                card.style.animationDelay = `${index * 0.12}s`;

                const bannerImg = item.banner_url ? `<img src="${item.banner_url}" class="banner">` : `<div class="banner">Banner</div>`;
                
                card.innerHTML = `
                    ${bannerImg}
                    <div class="file-info">
                        <div class="file-title">${item.title}</div>
                        <div class="file-desc">${item.description || 'mô tả...'}</div>
                    </div>
                    ${isDeleteMode ? `<button class="btn-card-del" onclick="deleteFile(${item.id})">Xóa</button>` : ''}
                `;
                container.appendChild(card);
            });
        }

        // --- XỬ LÝ CLICK AVATAR (MỞ ADMIN MODAL) ---
        let avatarClicks = 0, clickTimer = null;
        document.getElementById('avatarBtn').addEventListener('click', () => {
            avatarClicks++;
            clearTimeout(clickTimer);
            if (avatarClicks === 3) {
                avatarClicks = 0;
                openPasswordModal('add');
            } else {
                clickTimer = setTimeout(() => { avatarClicks = 0; }, 400);
            }
        });

        // --- VUỐT MÀN HÌNH MỞ MENU QUẢN TRỊ ---
        let touchStartX = 0, touchEndX = 0;
        let swipeRightCount = 0, swipeLeftCount = 0, swipeTimer = null;

        document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            const diffX = touchEndX - touchStartX;
            if (Math.abs(diffX) < 50) return;

            clearTimeout(swipeTimer);
            swipeTimer = setTimeout(() => { swipeRightCount = 0; swipeLeftCount = 0; }, 1500);

            if (diffX < -50) { 
                swipeLeftCount++; swipeRightCount = 0;
                if (swipeLeftCount === 3) { swipeLeftCount = 0; openPasswordModal('add'); }
            } else if (diffX > 50) { 
                swipeRightCount++; swipeLeftCount = 0;
                if (swipeRightCount === 3) { swipeRightCount = 0; openPasswordModal('delete'); }
            }
        });

        // --- ADMIN FUNCTIONS ---
        function openPasswordModal(action) {
            pendingAction = action;
            document.getElementById('pwInput').value = '';
            document.getElementById('pwModal').style.display = 'flex';
        }

        function checkPassword() {
            if (document.getElementById('pwInput').value === AUTH_PASS) {
                closeModals();
                if (pendingAction === 'add') document.getElementById('adminModal').style.display = 'flex';
                else if (pendingAction === 'delete') { isDeleteMode = !isDeleteMode; renderFiles(); }
            } else alert("Mật khẩu không đúng!");
        }

        function closeModals() {
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
        }

        async function addNewFile() {
            const title = document.getElementById('fileTitle').value;
            const description = document.getElementById('fileDesc').value;
            const banner_url = document.getElementById('fileBanner').value;
            const media_url = document.getElementById('fileLink').value;

            if(!title || !media_url) return alert("Cần nhập Tên file và Link!");

            const { error } = await db.from('files').insert([{ title, description, banner_url, media_url }]);
            if(!error) {
                closeModals();
                loadFiles();
            } else alert("Lỗi khi thêm file!");
        }

        async function deleteFile(id) {
            if(!confirm("Xóa file này?")) return;
            const { error } = await db.from('files').delete().eq('id', id);
            if(!error) loadFiles();
        }

        loadFiles();
    </script>
</body>
</html>
